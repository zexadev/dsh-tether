## iOS 构建。产出未签名 ipa,供用户自行签名安装(AltStore / Sideloadly 等)。
##
## 不走 `tauri ios build`:那条路要求配置开发团队与签名身份,而本项目不持有
## Apple 开发者账号。改为让 tauri 生成 Xcode 工程后,用 xcodebuild 关掉签名
## 构建出 .app,再按 Payload/ 结构手工打成 ipa——这正是自签工具期望的输入。
##
## 手动触发:iOS 侧无法在本地验证,只能靠 CI 迭代,不该让它拖住发布流水线。
name: ios

on:
  workflow_dispatch:
  push:
    branches: [ios]

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: pnpm install
        working-directory: app

      - name: 生成 Xcode 工程
        run: pnpm exec tauri ios init --ci
        working-directory: app

      # 工程名与 scheme 名由 tauri 依 productName 推导,不写死;先列出来再挑,
      # 顺便让日志留下真实名字,以后对不上时一眼能看见。
      - name: 找出 Xcode 工程与 scheme
        id: xc
        run: |
          proj=$(find app/src-tauri/gen/apple -maxdepth 1 -name '*.xcodeproj' | head -1)
          echo "工程: $proj"
          xcodebuild -list -project "$proj"
          scheme=$(xcodebuild -list -project "$proj" -json | node -e "
            let s=''
            process.stdin.on('data', (d) => { s += d }).on('end', () => {
              const list = JSON.parse(s).project.schemes || []
              const hit = list.find((x) => x.endsWith('_iOS')) || list[0]
              if (!hit) { console.error('没有可用 scheme'); process.exit(1) }
              process.stdout.write(hit)
            })")
          echo "scheme: $scheme"
          echo "proj=$proj" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"

      # CODE_SIGNING_ALLOWED=NO 让 xcodebuild 跳过签名与授权文件嵌入,
      # 产出的 .app 没有签名——正是自签工具要重签的对象。
      - name: 构建(不签名)
        run: |
          xcodebuild \
            -project "${{ steps.xc.outputs.proj }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration release \
            -sdk iphoneos \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      # ipa 就是把 .app 放进 Payload/ 再 zip;没有别的仪式。
      - name: 打包 ipa
        run: |
          app=$(find ios-build/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)
          test -n "$app" || { echo "没找到构建产物 .app"; exit 1; }
          echo "产物: $app"
          version=$(node -p "require('./package.json').version")
          mkdir -p Payload
          cp -R "$app" Payload/
          zip -qry "dsh-tether-$version-ios-unsigned.ipa" Payload
          ls -la *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: '*.ipa'
          if-no-files-found: error
