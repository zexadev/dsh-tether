## iOS 构建。产出未签名 ipa,供用户自行签名安装(AltStore / Sideloadly 等)。
##
## 不能用 xcodebuild 直接驱动 tauri 生成的工程:工程的构建阶段会回调
## `tauri ios xcode-script`,而它要读 tauri CLI 父进程写的 IPC 文件
## ($TMPDIR/<identifier>-server-addr),脱离 CLI 运行时该文件不存在会 panic。
## 因此走 `tauri ios build`,并用它自带的 --no-sign 跳过签名——本项目不持有
## Apple 开发者账号,默认路径会以 "requires a development team" 失败。
##
## 手动触发:iOS 侧无法在本地验证,只能靠 CI 迭代,不该拖住已稳定的发布流水线。
name: ios

on:
  workflow_dispatch:
  push:
    branches: [ios]

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: pnpm install
        working-directory: app

      - name: 生成 Xcode 工程
        run: pnpm exec tauri ios init --ci
        working-directory: app

      - name: 构建(不签名)
        run: pnpm exec tauri ios build --ci --no-sign --target aarch64
        working-directory: app

      # --no-sign 之后 tauri 可能直接给出 ipa,也可能只留下 .app。两种都接:
      # 有 ipa 就取用,只有 .app 就自己打包——ipa 无非是 Payload/ 加一次 zip。
      - name: 打包 ipa
        run: |
          version=$(node -p "require('./package.json').version")
          out="dsh-tether-$version-ios-unsigned.ipa"

          ipa=$(find app/src-tauri/gen/apple -name '*.ipa' | head -1)
          if [ -n "$ipa" ]; then
            echo "tauri 已产出 ipa: $ipa"
            cp "$ipa" "$out"
          else
            app=$(find app/src-tauri/gen/apple -name '*.app' -type d | head -1)
            test -n "$app" || { echo '既没有 ipa 也没有 .app,构建实际未产出任何东西'; exit 1; }
            echo "自行打包 .app: $app"
            mkdir -p Payload
            cp -R "$app" Payload/
            zip -qry "$out" Payload
          fi

          ls -la "$out"
          echo '--- 包内结构 ---'
          unzip -l "$out" | head -12

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: '*.ipa'
          if-no-files-found: error

      - name: 失败时看看产出了什么
        if: failure()
        run: |
          for pat in '*.app' '*.ipa' '*.xcarchive'; do
            echo "--- $pat ---"
            find app/src-tauri/gen/apple -maxdepth 6 -name "$pat" 2>/dev/null | head -3
          done
          echo '--- iOS 目标的 rust 产物 ---'
          find app/src-tauri/target -maxdepth 3 -name '*.a' -path '*ios*' 2>/dev/null | head
