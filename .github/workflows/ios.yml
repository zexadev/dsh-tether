## iOS 构建。产出未签名 ipa,供用户自行签名安装(AltStore / Sideloadly 等)。
##
## 不走 `tauri ios build`:那条路要求配置开发团队与签名身份,而本项目不持有
## Apple 开发者账号。改为让 tauri 生成 Xcode 工程后,用 xcodebuild 关掉签名
## 构建出 .app,再按 Payload/ 结构手工打成 ipa——这正是自签工具期望的输入。
##
## 手动触发:iOS 侧无法在本地验证,只能靠 CI 迭代,不该让它拖住发布流水线。
name: ios

on:
  workflow_dispatch:
  push:
    branches: [ios]

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: pnpm install
        working-directory: app

      - name: 生成 Xcode 工程
        run: pnpm exec tauri ios init --ci
        working-directory: app

      # xcode-script 是被 Xcode 构建阶段回调的,它要读 tauri CLI 父进程写的 IPC
      # 文件($TMPDIR/<identifier>-server-addr);直接调 xcodebuild 时该文件不存在,
      # 会 panic。所以这条工程不能脱离 tauri CLI 驱动,必须走 tauri ios build。
      # 本轮先把它的可用选项打出来,再试一次,失败也继续,好一次拿全信息。
      - name: tauri ios build 的选项
        run: |
          pnpm exec tauri --version
          pnpm exec tauri ios build --help
        working-directory: app

      - name: 试构建
        id: try
        continue-on-error: true
        run: pnpm exec tauri ios build --ci 2>&1 | tail -60
        working-directory: app

      - name: 产出了什么
        if: always()
        run: |
          echo '--- gen/apple 顶层 ---'
          ls -la app/src-tauri/gen/apple 2>/dev/null || true
          echo '--- 找 .app / .ipa / .xcarchive ---'
          find app/src-tauri/gen/apple -maxdepth 6 ( -name '*.app' -o -name '*.ipa' -o -name '*.xcarchive' ) 2>/dev/null | head
          echo '--- 找 iOS 目标的 rust 产物 ---'
          find app/src-tauri/target -maxdepth 3 -name '*.a' -path '*ios*' 2>/dev/null | head
