[package]
name = "dsh-tether-app"
version = "0.1.29"
edition = "2021"
license = "MIT"

[lib]
name = "dsh_tether_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
anyhow = "1"
iroh = "1.0.0"
tether-core = { path = "../../tether-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-notification = "2.3.3"
tokio = { version = "1", features = ["sync", "time", "net", "io-util", "process"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dshlocal = { path = "../plugins/tauri-plugin-dshlocal" }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
# iroh 引入的 reqwest 以 rustls-no-provider 构建,必须由应用安装全局 crypto
# provider(与 iroh 默认 tls-ring 同一后端),否则建端点时 panic(安卓实测复现)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
