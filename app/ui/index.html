<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DSH Tether</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand" id="brand">DSH Tether</div>
    <div class="status">
      <span id="status-dot" class="dot dot-off"></span>
      <span id="status-text" data-i18n="status.disconnected"></span>
    </div>
    <!-- 本地模式的 dsh 界面里没有插件按钮可回主机页,顶栏给一个常驻入口 -->
    <button id="topbar-hosts" class="btn btn-slim btn-slim-quiet topbar-hosts hidden" data-i18n="topbar.hosts"></button>
  </header>

  <main id="view-hosts" class="view hidden">
    <section id="local-card" class="local-card hidden">
      <div class="local-head">
        <span class="host-name" data-i18n="local.title"></span>
        <span id="local-state" class="host-meta" data-i18n="local.idle"></span>
      </div>
      <p class="hint" data-i18n="local.hint"></p>
      <p id="local-card-note" class="hint hidden" data-i18n="local.bgNote"></p>
      <button id="local-open" class="btn btn-block" data-i18n="local.start"></button>
      <button id="local-stop" class="btn btn-quiet btn-block hidden" data-i18n="local.stop"></button>
      <p id="local-error" class="error hidden"></p>
    </section>
    <h1 data-i18n="hosts.title"></h1>
    <p class="hint" data-i18n="hosts.hint"></p>
    <ul id="host-list" class="host-list"></ul>
    <p id="hosts-empty" class="empty hidden" data-i18n="hosts.empty"></p>
    <p id="hosts-error" class="error hidden"></p>
    <button id="add-host" class="btn btn-block" data-i18n="hosts.add"></button>
    <button id="hosts-back" class="btn btn-quiet btn-block" data-i18n="hosts.back"></button>
    <!-- 安卓专属:远程连接退后台时额外持 CPU 唤醒锁,熄屏也不断;更耗电,默认关 -->
    <div id="wakelock-setting" class="setting hidden">
      <label class="toggle">
        <span data-i18n="settings.wakeLock"></span>
        <input id="wakelock-toggle" type="checkbox" role="switch" />
      </label>
      <p class="hint" data-i18n="settings.wakeLockHint"></p>
    </div>
    <p id="battery-hint" class="hint hidden" data-i18n="hosts.batteryHint"></p>
    <footer class="about">
      <span id="about-version">DSH Tether</span>
      <button id="open-about" class="btn btn-slim btn-slim-quiet" data-i18n="about.entry"></button>
    </footer>
  </main>

  <main id="view-about" class="view hidden">
    <h1>DSH Tether</h1>
    <p id="about-version-line" class="hint"></p>
    <button id="about-github" class="btn btn-block">GitHub</button>
    <button id="about-update" class="btn btn-quiet btn-block" data-i18n="update.check"></button>
    <p id="update-status" class="hint hidden"></p>
    <h1 data-i18n="about.thanksTitle"></h1>
    <p class="hint" data-i18n="about.thanks"></p>
    <button id="about-back" class="btn btn-quiet btn-block" data-i18n="hosts.back"></button>
  </main>

  <main id="view-pair" class="view hidden">
    <h1 data-i18n="pair.title"></h1>
    <p class="hint" data-i18n-html="pair.hint"></p>
    <label><span data-i18n="pair.peer"></span>
      <input id="pair-peer" type="text" autocomplete="off" spellcheck="false" data-i18n-ph="pair.peerPlaceholder" />
    </label>
    <label><span data-i18n="pair.code"></span>
      <input id="pair-code" type="text" inputmode="numeric" maxlength="6" autocomplete="off" data-i18n-ph="pair.codePlaceholder" />
    </label>
    <label><span data-i18n="pair.label"></span>
      <input id="pair-label" type="text" autocomplete="off" data-i18n-ph="pair.labelPlaceholder" />
    </label>
    <label><span data-i18n="pair.name"></span>
      <input id="pair-name" type="text" autocomplete="off" data-i18n-value="pair.nameDefault" />
    </label>
    <p id="pair-error" class="error hidden"></p>
    <button id="pair-submit" class="btn btn-block" data-i18n="pair.submit"></button>
    <button id="pair-cancel" class="btn btn-quiet btn-block" data-i18n="common.cancel"></button>
  </main>

  <main id="view-status" class="view hidden">
    <div id="reconnect-row" class="hidden">
      <p id="reconnect-text" class="hint"></p>
      <button id="reconnect" class="btn btn-block" data-i18n="status.reconnect"></button>
      <button id="open-hosts" class="btn btn-quiet btn-block" data-i18n="status.switch"></button>
    </div>
    <p id="connecting-note" class="empty" data-i18n="status.connectingPc"></p>
    <p id="local-bg-note" class="hint hidden" data-i18n="status.localBg"></p>
  </main>

  <iframe id="webui" class="webui hidden" title="DeepSeek Harness"></iframe>

  <script src="i18n.js" defer></script>
  <script src="main.js" defer></script>
</body>
</html>
