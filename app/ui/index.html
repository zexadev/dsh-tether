<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DSH Remote</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">DSH Remote</div>
    <div class="status">
      <span id="status-dot" class="dot dot-off"></span>
      <span id="status-text">未连接</span>
    </div>
  </header>

  <main id="view-pair" class="view hidden">
    <h1>配对主机</h1>
    <p class="hint">在电脑上启动 dsh 后,插件会打印主机 ID 与 6 位配对码。可直接粘贴「ID#配对码」组合串。</p>
    <label>主机 ID
      <input id="pair-peer" type="text" autocomplete="off" spellcheck="false" placeholder="64 位十六进制,或 ID#配对码" />
    </label>
    <label>配对码
      <input id="pair-code" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="6 位数字" />
    </label>
    <label>设备名称
      <input id="pair-name" type="text" autocomplete="off" value="我的手机" />
    </label>
    <p id="pair-error" class="error hidden"></p>
    <button id="pair-submit" class="btn btn-primary btn-block">配对并连接</button>
  </main>

  <main id="view-main" class="view hidden">
    <div id="reconnect-row" class="reconnect-row hidden">
      <p id="reconnect-text" class="hint"></p>
      <button id="reconnect" class="btn btn-primary btn-block">重新连接</button>
    </div>
    <div id="cards"></div>
    <p id="empty" class="empty">暂无待审批操作。agent 需要授权时,这里会弹出卡片。</p>
  </main>

  <script src="main.js" defer></script>
</body>
</html>
